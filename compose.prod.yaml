name: ocean-intelligence

x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  database:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ocean_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-ocean}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the production env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocean} -d ${POSTGRES_DB:-ocean_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 512mb
    networks:
      - private
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        VITE_TIANDITU_TOKEN: ${VITE_TIANDITU_TOKEN:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: ${APP_IMAGE:-ocean-intelligence:production}
    pull_policy: ${APP_PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      APP_ENV: production
      AUTH_REQUIRED: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ocean}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-ocean_intelligence}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in the production env file}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-2592000}
      TRUST_PROXY_HEADERS: "true"
      ALLOWED_HOSTS: ${SITE_HOST:?set SITE_HOST in the production env file}
      ALLOWED_ORIGINS: ${SITE_ORIGIN:?set SITE_ORIGIN in the production env file}
      REALTIME_CACHE_TTL_SECONDS: ${REALTIME_CACHE_TTL_SECONDS:-300}
      ARGO_REALTIME_INTERVAL_SECONDS: ${ARGO_REALTIME_INTERVAL_SECONDS:-600}
      ARGO_REALTIME_SAMPLE_LIMIT: ${ARGO_REALTIME_SAMPLE_LIMIT:-16}
      ARGO_REALTIME_REGIONS: ${ARGO_REALTIME_REGIONS:-south_china_sea,northwest_pacific,global_ocean}
      DAILY_BRIEF_TIME_ZONE: ${DAILY_BRIEF_TIME_ZONE:-Asia/Shanghai}
      DAILY_BRIEF_GENERATE_HOUR: ${DAILY_BRIEF_GENERATE_HOUR:-8}
      DAILY_BRIEF_PUBLISH_HOUR: ${DAILY_BRIEF_PUBLISH_HOUR:-9}
      DAILY_BRIEF_POLL_SECONDS: ${DAILY_BRIEF_POLL_SECONDS:-30}
      DAILY_BRIEF_WEBHOOK_URL: ${DAILY_BRIEF_WEBHOOK_URL:-}
      EVENT_TYPE_RECORD_TARGET: ${EVENT_TYPE_RECORD_TARGET:-100}
      COPERNICUSMARINE_USERNAME: ${COPERNICUSMARINE_USERNAME:-}
      COPERNICUSMARINE_PASSWORD: ${COPERNICUSMARINE_PASSWORD:-}
      COPERNICUSMARINE_WAVE_DATASET_ID: ${COPERNICUSMARINE_WAVE_DATASET_ID:-cmems_mod_glo_wav_anfc_0.083deg_PT3H-i}
      COPERNICUSMARINE_WIND_DATASET_ID: ${COPERNICUSMARINE_WIND_DATASET_ID:-cmems_obs-wind_glo_phy_nrt_l4_0.125deg_PT1H}
      COPERNICUSMARINE_CURRENT_DATASET_ID: ${COPERNICUSMARINE_CURRENT_DATASET_ID:-cmems_mod_glo_phy_anfc_merged-uv_PT1H-i}
      COPERNICUSMARINE_CURRENT_U_VARIABLE: ${COPERNICUSMARINE_CURRENT_U_VARIABLE:-utotal}
      COPERNICUSMARINE_CURRENT_V_VARIABLE: ${COPERNICUSMARINE_CURRENT_V_VARIABLE:-vtotal}
      COPERNICUSMARINE_CURRENT_CACHE_TTL_SECONDS: ${COPERNICUSMARINE_CURRENT_CACHE_TTL_SECONDS:-300}
      COPERNICUSMARINE_CURRENT_ARCO_URL: ${COPERNICUSMARINE_CURRENT_ARCO_URL:-https://s3.waw4-1.cloudferro.com/mdl-arco-time-015/arco/GLOBAL_ANALYSISFORECAST_PHY_001_024/cmems_mod_glo_phy_anfc_merged-uv_PT1H-i_202211/timeChunked.zarr}
      COPERNICUSMARINE_CURRENT_CHUNK_CACHE_LIMIT: ${COPERNICUSMARINE_CURRENT_CHUNK_CACHE_LIMIT:-8}
      COPERNICUSMARINE_GLOBAL_VOLUME_CACHE_TTL_SECONDS: ${COPERNICUSMARINE_GLOBAL_VOLUME_CACHE_TTL_SECONDS:-300}
      COPERNICUSMARINE_POINT_CACHE_TTL_SECONDS: ${COPERNICUSMARINE_POINT_CACHE_TTL_SECONDS:-900}
      COPERNICUSMARINE_POINT_CACHE_LIMIT: ${COPERNICUSMARINE_POINT_CACHE_LIMIT:-512}
      OCEAN_CODEX_MCP_TOKEN: ${OCEAN_CODEX_MCP_TOKEN:?set OCEAN_CODEX_MCP_TOKEN in the production env file}
      OCEAN_CODEX_TENANT_SECRET: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in the production env file}
      OCEAN_MCP_STATE_DB: /app/.runtime/mcp-state.sqlite3
      OCEAN_MCP_STATE_DATABASE_URL: postgresql://${POSTGRES_USER:-ocean}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-ocean_intelligence}
      OCEAN_MCP_EXPORT_DIR: /app/.runtime/mcp-exports
      OCEAN_MCP_SNAPSHOT_TTL_SECONDS: ${OCEAN_MCP_SNAPSHOT_TTL_SECONDS:-1800}
      OCEAN_MCP_TOOL_TIMEOUT_SECONDS: ${OCEAN_MCP_TOOL_TIMEOUT_SECONDS:-45}
      OCEAN_MCP_MAX_RESPONSE_BYTES: ${OCEAN_MCP_MAX_RESPONSE_BYTES:-8388608}
      OCEAN_MCP_RATE_WINDOW_SECONDS: ${OCEAN_MCP_RATE_WINDOW_SECONDS:-60}
      OCEAN_MCP_RATE_CALLS: ${OCEAN_MCP_RATE_CALLS:-120}
      OCEAN_MCP_TENANT_CONCURRENCY: ${OCEAN_MCP_TENANT_CONCURRENCY:-4}
      OCEAN_MCP_TOOL_CONCURRENCY: ${OCEAN_MCP_TOOL_CONCURRENCY:-8}
      OCEAN_MCP_JOB_WORKERS: ${OCEAN_MCP_JOB_WORKERS:-4}
      OCEAN_MCP_SOURCE_SNAPSHOT_MAX_RECORDS: ${OCEAN_MCP_SOURCE_SNAPSHOT_MAX_RECORDS:-200000}
      OCEAN_TIME_ZONE: ${OCEAN_TIME_ZONE:-America/New_York}
      CODEX_RUNTIME_URL: http://codex-runtime:8011
    expose:
      - "8000"
    volumes:
      - agent_runtime:/app/.runtime
      - realtime_cache:/app/backend/.cache
      - ./frontend/public/video:/app/frontend-dist/video:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 45s
    networks:
      private:
        ipv4_address: 192.168.16.10
    logging: *default-logging

  copernicus-indexer:
    image: ${APP_IMAGE:-ocean-intelligence:production}
    profiles: ["jobs"]
    restart: "no"
    command:
      - python
      - -m
      - app.copernicus_daily_collect
      - --raw-path
      - /app/backend/.cache/copernicus_daily_index/latest-points.json
      - --index-path
      - /app/backend/.cache/copernicus_daily_index/active.sqlite3
      - --target
      - "10000"
      - --request-timeout
      - "90"
    environment:
      APP_ENV: production
      PYTHONPATH: /app/backend
      COPERNICUS_DAILY_TARGET: ${COPERNICUS_DAILY_TARGET:-10000}
      COPERNICUSMARINE_USERNAME: ${COPERNICUSMARINE_USERNAME:-}
      COPERNICUSMARINE_PASSWORD: ${COPERNICUSMARINE_PASSWORD:-}
      COPERNICUSMARINE_WAVE_DATASET_ID: ${COPERNICUSMARINE_WAVE_DATASET_ID:-cmems_mod_glo_wav_anfc_0.083deg_PT3H-i}
      COPERNICUSMARINE_WIND_DATASET_ID: ${COPERNICUSMARINE_WIND_DATASET_ID:-cmems_obs-wind_glo_phy_nrt_l4_0.125deg_PT1H}
    volumes:
      - realtime_cache:/app/backend/.cache
      - ./backend:/app/backend:ro
    cpus: 0.75
    mem_limit: 768m
    networks:
      - private
    logging: *default-logging

  codex-runtime:
    image: ${NODE_IMAGE:-node:22-alpine}
    restart: unless-stopped
    command: ["node", "/app/codex-runtime/server/index.mjs"]
    environment:
      HOME: /root
      CODEX_HOME: /root/.codex
      OCEAN_CODEX_HOST: 0.0.0.0
      OCEAN_CODEX_PORT: "8011"
      OCEAN_CODEX_WORKSPACE: /workspace
      OCEAN_CODEX_BIN: /opt/codex-cli/bin/codex
      OCEAN_CODEX_MCP_URL: http://app:8000/api/codex/mcp
      OCEAN_CODEX_MCP_TOKEN: ${OCEAN_CODEX_MCP_TOKEN:?set OCEAN_CODEX_MCP_TOKEN in the production env file}
      OCEAN_CODEX_TENANT_SECRET: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in the production env file}
    volumes:
      - ./codex-runtime:/app/codex-runtime:ro
      - /opt/codex-cli:/opt/codex-cli:ro
      - /root/.codex:/root/.codex
      - ./:/workspace:ro
      - ./generated:/workspace/generated
      - ./.runtime:/workspace/.runtime
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "8011"
    networks:
      - private
    logging: *default-logging

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    profiles: ["direct"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in the production env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - private
    logging: *default-logging

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      TUNNEL_URL: http://192.168.16.10:8000
    depends_on:
      app:
        condition: service_healthy
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres_data:
  agent_runtime:
  realtime_cache:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.16.0/20
