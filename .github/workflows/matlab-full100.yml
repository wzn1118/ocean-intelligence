name: MATLAB Full 100 Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/matlab-full100.yml"
      - "codex-runtime/matlab/**"
      - "codex-runtime/server/matlab-**"
      - "codex-runtime/server/point-**"
      - "codex-runtime/server/illustrated-report-**"
      - "codex-runtime/server/ocean-report-**"
      - "codex-runtime/server/ocean-evidence-time.*"
      - "codex-runtime/server/professional-visualization-**"
      - "codex-runtime/server/package*.json"
      - "deploy/Dockerfile.codex-runtime"
      - "scripts/matlab-**"
      - "scripts/full-matlab-**"
      - ".codex-evals/matlab-100-20260905/**"
  pull_request:
    paths:
      - ".github/workflows/matlab-full100.yml"
      - "codex-runtime/matlab/**"
      - "codex-runtime/server/matlab-**"
      - "codex-runtime/server/point-**"
      - "codex-runtime/server/illustrated-report-**"
      - "codex-runtime/server/ocean-report-**"
      - "codex-runtime/server/ocean-evidence-time.*"
      - "codex-runtime/server/professional-visualization-**"
      - "codex-runtime/server/package*.json"
      - "deploy/Dockerfile.codex-runtime"
      - "scripts/matlab-**"
      - "scripts/full-matlab-**"
      - ".codex-evals/matlab-100-20260905/**"

permissions:
  contents: read

concurrency:
  group: matlab-full100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: Static and contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install evaluation dependencies
        run: python3 -m pip install -r codex-runtime/matlab/evals/requirements.txt
      - name: MATLAB syntax at oldest runtime boundary
        run: mh_lint --brief --input-encoding utf-8 --matlab 2021a codex-runtime/matlab/assets codex-runtime/matlab/tests codex-runtime/matlab/evals
      - name: Install report parser dependency
        run: npm ci --prefix codex-runtime/server --ignore-scripts --no-audit --no-fund
      - name: Run Node contracts
        run: node --test codex-runtime/server/*.test.mjs
      - name: Generated router smoke preparation contracts
        run: node --test codex-runtime/matlab/tests/generate_router_smoke.test.mjs
      - name: MATLAB asset contracts
        run: python3 codex-runtime/matlab/tests/validate_assets.py
      - name: Full-score evaluator tests
        run: python3 -m unittest discover -s codex-runtime/matlab/evals/tests -p 'test_*.py' -v
      - name: Static full-score evaluation
        run: python3 codex-runtime/matlab/evals/evaluate.py --runtime skip
      - name: Shell syntax
        run: bash -n scripts/matlab-plot-regression.sh scripts/full-matlab-capability-report.sh scripts/matlab-github-full100.sh

  matlab-runtime:
    name: MATLAB ${{ matrix.release }} runtime
    needs: static-gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        release: [R2021a, R2024b, R2026a]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install evaluation dependencies
        run: python3 -m pip install -r codex-runtime/matlab/evals/requirements.txt
      - name: Install publication CJK fonts
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-wqy-zenhei fonts-droid-fallback poppler-utils xvfb x11-utils
          fc-cache -f
          fc-list | grep -Ei 'Noto Sans CJK|WenQuanYi Zen Hei|Droid Sans Fallback' | head -n 12
      - name: Install and license MathWorks MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          cache: true
      - name: Prepare isolated evidence directory
        shell: bash
        run: |
          output="${RUNNER_TEMP}/ocean-matlab-full100-${{ matrix.release }}"
          rm -rf "$output"
          mkdir -p "$output/evaluator-runtime"
          nonce="$(openssl rand -hex 32)"
          nonce_sha256="$(printf '%s' "$nonce" | sha256sum | cut -d' ' -f1)"
          python3 - "$output/runtime-start.marker" "${{ matrix.release }}" "$nonce_sha256" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          marker = {
              "schema_version": 1,
              "created_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "expected_release": sys.argv[2],
              "nonce_sha256": sys.argv[3],
          }
          Path(sys.argv[1]).write_text(json.dumps(marker, indent=2) + "\n", encoding="utf-8")
          PY
          echo "MATLAB_FULL100_OUTPUT=$output" >> "$GITHUB_ENV"
          echo "MATLAB_EVAL_NONCE=$nonce" >> "$GITHUB_ENV"
      - name: Prepare deterministic router smoke scripts
        continue-on-error: true
        shell: bash
        run: node codex-runtime/matlab/tests/generate_router_smoke.mjs "${{ matrix.release }}" "$MATLAB_FULL100_OUTPUT"
      - name: Start R2026a native rendering display
        if: matrix.release == 'R2026a'
        shell: bash
        run: |
          test ! -e /tmp/.X97-lock
          Xvfb :97 -screen 0 1600x1200x24 -nolisten tcp > "$MATLAB_FULL100_OUTPUT/primary-display-server.log" 2>&1 &
          echo "MATLAB_PRIMARY_XVFB_PID=$!" >> "$GITHUB_ENV"
          echo "DISPLAY=:97" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if xdpyinfo -display :97 > "$MATLAB_FULL100_OUTPUT/primary-display-server-info.txt" 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run licensed MATLAB plotting, reporting and interaction gates
        id: matlab-runtime
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          startup-options: ${{ matrix.release == 'R2026a' && '-display :97' || '' }}
          command: addpath('codex-runtime/matlab/tests'); run_github_full100('${{ matrix.release }}', getenv('MATLAB_FULL100_OUTPUT'), getenv('MATLAB_EVAL_NONCE'))
      - name: Validate MATLAB evidence and compute runtime score
        id: runtime-score
        if: always()
        continue-on-error: true
        shell: bash
        env:
          MW_BATCH_LICENSING_ONLINE: "true"
          MATLAB_ACTIONS_RUN_COMMAND: ${{ github.workspace }}/../../_actions/matlab-actions/run-command/v3/dist/bin/glnxa64/run-matlab-command
        run: bash scripts/matlab-github-full100.sh "${{ matrix.release }}" "$MATLAB_FULL100_OUTPUT" "$MATLAB_EVAL_NONCE" "$MATLAB_FULL100_OUTPUT/runtime-start.marker"
      - name: Start isolated virtual display for diagnostic comparison
        id: virtual-display
        if: always() && env.MATLAB_FULL100_OUTPUT != ''
        continue-on-error: true
        shell: bash
        run: |
          test ! -e /tmp/.X98-lock
          Xvfb :98 -screen 0 1600x1200x24 -nolisten tcp > "$MATLAB_FULL100_OUTPUT/display-server.log" 2>&1 &
          echo "MATLAB_XVFB_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if xdpyinfo -display :98 > "$MATLAB_FULL100_OUTPUT/display-server-info.txt" 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Compare native rendering with a virtual display
        if: always() && steps.virtual-display.outcome == 'success'
        continue-on-error: true
        env:
          DISPLAY: ":98"
        uses: matlab-actions/run-command@v3
        with:
          startup-options: -display :98
          command: addpath('codex-runtime/matlab/tests'); test_display_rendering('${{ matrix.release }}', fullfile(getenv('MATLAB_FULL100_OUTPUT'), 'display-comparison'))
      - name: Stop diagnostic virtual display
        if: always() && env.MATLAB_XVFB_PID != ''
        shell: bash
        run: kill "$MATLAB_XVFB_PID" || true
      - name: Stop R2026a native rendering display
        if: always() && env.MATLAB_PRIMARY_XVFB_PID != ''
        shell: bash
        run: kill "$MATLAB_PRIMARY_XVFB_PID" || true
      - name: Enforce MATLAB runtime and score gate
        if: always()
        shell: bash
        env:
          MATLAB_STEP_OUTCOME: ${{ steps.matlab-runtime.outcome }}
          SCORE_STEP_OUTCOME: ${{ steps.runtime-score.outcome }}
        run: |
          printf 'MATLAB_STEP_OUTCOME=%s\n' "$MATLAB_STEP_OUTCOME"
          printf 'SCORE_STEP_OUTCOME=%s\n' "$SCORE_STEP_OUTCOME"
          test "$MATLAB_STEP_OUTCOME" = success
          test "$SCORE_STEP_OUTCOME" = success
      - name: Upload MATLAB evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matlab-full100-${{ matrix.release }}
          path: ${{ runner.temp }}/ocean-matlab-full100-${{ matrix.release }}
          if-no-files-found: error
          retention-days: 30

  visual-review-bundle:
    name: Visual review bundle ready
    needs: matlab-runtime
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report next gate
        run: |
          echo "Runtime artifacts are available from the three MATLAB jobs."
          echo "Download them, perform the hash-bound visual/CJK/interaction audit,"
          echo "then rerun evaluate.py with --runtime require --visual-audit <trusted JSON>."
