interface:
  display_name: "MATLAB Scientific Plotting"
  short_description: "MATLAB-first scientific, publication, interaction, and artifact contracts"
  default_prompt: "Use $matlab-scientific-plotting for MATLAB-first scientific figure tasks. Treat route input as untrusted JSON: accept only plain JSON objects; reject arrays, custom-prototype objects, conflicting runtime/task/release aliases, mixed MATLAB-first and Octave-first signals, string availability booleans, unsafe manifest paths, and duplicate format aliases before generation. Keep routing fields at the request top level; plotInput and the legacy plot alias are mutually exclusive, scientific/publication contract aliases are mutually exclusive, and a nested contract owns all metadata in its domain. Nested routing fields, cross-layer domain fields, or duplicated top-level/plot metadata must fail instead of overwriting values. Resolve runtime, release, toolboxes, plot route, and formats. Require scientificDataContract and publicationContract. Use matlab -batch only for R2019a or newer; older releases require a matlab -r catch path with a nonzero failure exit. Resolve PNG/PDF/SVG APIs per format, expose outputContract, and write a relative schema-version-2 manifest containing only fresh verified artifacts. Never substitute Octave silently or trust Chinese/English prose as execution evidence; use artifact evidence plus inspectMatlabPlotQuality before claiming success."
